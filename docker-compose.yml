services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sim
      POSTGRES_PASSWORD: sim        # dev-only credentials; change for any real deployment
      POSTGRES_DB: netsim
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sim -d netsim"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://sim:sim@db:5432/netsim
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata: